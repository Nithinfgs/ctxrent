<svg xmlns="http://www.w3.org/2000/svg" width="847" height="852" viewBox="0 0 847 852" role="img" aria-label="ctxrent demo output: tool outputs account for about half of all tokens the model re-read">
<rect width="847" height="852" rx="10" fill="#0d1117"/>
<rect width="847" height="32" rx="10" fill="#161b22"/>
<rect y="22" width="847" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f56"/><circle cx="40" cy="16" r="6" fill="#ffbd2e"/><circle cx="60" cy="16" r="6" fill="#27c93f"/>
<text x="423.5" y="21" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">npx ctxrent demo</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
<text x="20" y="52" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">ctxrent</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3">  1 session </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> 66 model calls </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">3.5M</tspan><tspan fill="#e6edf3"> tokens re-read</tspan></text>
<text x="20" y="72" xml:space="preserve"><tspan fill="#e3b341">synthetic demo session - fabricated to show the report, not your data</tspan></text>
<text x="20" y="92" xml:space="preserve"></text>
<text x="20" y="112" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Where the re-read tokens came from</tspan></text>
<text x="20" y="132" xml:space="preserve"><tspan fill="#e6edf3">  tool outputs                           </tspan><tspan fill="#ff7b72">██████████████▍         </tspan><tspan fill="#e6edf3">  60%  </tspan><tspan fill="#8b949e">2.1M</tspan></text>
<text x="20" y="152" xml:space="preserve"><tspan fill="#e6edf3">  fixed baseline (prompt, tools, memory) </tspan><tspan fill="#79c0ff">███████▋                </tspan><tspan fill="#e6edf3">  32%  </tspan><tspan fill="#8b949e">1.1M</tspan></text>
<text x="20" y="172" xml:space="preserve"><tspan fill="#e6edf3">  messages, thinking &amp; other             </tspan><tspan fill="#d2a8ff">██                      </tspan><tspan fill="#e6edf3">   8%  </tspan><tspan fill="#8b949e">288k</tspan></text>
<text x="20" y="192" xml:space="preserve"></text>
<text x="20" y="212" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Context size per call</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">peak 108k · 1 compaction</tspan></text>
<text x="20" y="232" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">▂▃▃▃▃▃▃▃▃▃▄▄▄▄▄▄▄▄▄▅▅▅▅▅▅▆▆▆▆▆▆▇▇▇█████▂▃▃▃▃▃▃▃▃▃▃▃▃▃▃▃▄▄▄▄▄▄▅▅▅▅▅</tspan></text>
<text x="20" y="252" xml:space="preserve"></text>
<text x="20" y="272" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Who pays the rent</tspan><tspan fill="#8b949e">   (output size x calls that re-read it)</tspan></text>
<text x="20" y="292" xml:space="preserve"><tspan fill="#8b949e">                                 calls    size     rent  share of tool rent</tspan></text>
<text x="20" y="312" xml:space="preserve"><tspan fill="#e6edf3">  Bash: npm test                     6     40k  </tspan><tspan fill="#e6edf3" font-weight="700">   720k</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">████▉         </tspan><tspan fill="#e6edf3"> 35%</tspan></text>
<text x="20" y="332" xml:space="preserve"><tspan fill="#e6edf3">  Read: src/db/schema.ts             2     34k  </tspan><tspan fill="#e6edf3" font-weight="700">   473k</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">███▏          </tspan><tspan fill="#e6edf3"> 23%</tspan></text>
<text x="20" y="352" xml:space="preserve"><tspan fill="#e6edf3">  Grep: refreshToken                 1    9.3k  </tspan><tspan fill="#e6edf3" font-weight="700">   355k</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">██▍           </tspan><tspan fill="#e6edf3"> 17%</tspan></text>
<text x="20" y="372" xml:space="preserve"><tspan fill="#e6edf3">  Read: src/auth/session.ts          2    5.9k  </tspan><tspan fill="#e6edf3" font-weight="700">   171k</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">█▏            </tspan><tspan fill="#e6edf3"> 8%</tspan></text>
<text x="20" y="392" xml:space="preserve"><tspan fill="#e6edf3">  Bash: git diff                     2     17k  </tspan><tspan fill="#e6edf3" font-weight="700">   130k</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">▉             </tspan><tspan fill="#e6edf3"> 6%</tspan></text>
<text x="20" y="412" xml:space="preserve"><tspan fill="#e6edf3">  Bash: npm run lint                 1    4.0k  </tspan><tspan fill="#e6edf3" font-weight="700">    68k</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">▌             </tspan><tspan fill="#e6edf3"> 3%</tspan></text>
<text x="20" y="432" xml:space="preserve"><tspan fill="#e6edf3">  Read: src/auth/refresh.ts          1    1.9k  </tspan><tspan fill="#e6edf3" font-weight="700">    54k</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">▍             </tspan><tspan fill="#e6edf3"> 3%</tspan></text>
<text x="20" y="452" xml:space="preserve"><tspan fill="#e6edf3">  WebFetch: docs.example.com         1     11k  </tspan><tspan fill="#e6edf3" font-weight="700">    53k</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">▍             </tspan><tspan fill="#e6edf3"> 3%</tspan></text>
<text x="20" y="472" xml:space="preserve"></text>
<text x="20" y="492" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Most expensive single outputs</tspan></text>
<text x="20" y="512" xml:space="preserve"><tspan fill="#8b949e">                                   size  x calls   = rent</tspan></text>
<text x="20" y="532" xml:space="preserve"><tspan fill="#e6edf3">  Grep: refreshToken               9.3k       38  </tspan><tspan fill="#e6edf3" font-weight="700">   355k</tspan></text>
<text x="20" y="552" xml:space="preserve"><tspan fill="#e6edf3">  Read: src/db/schema.ts            17k       20  </tspan><tspan fill="#e6edf3" font-weight="700">   338k</tspan></text>
<text x="20" y="572" xml:space="preserve"><tspan fill="#e6edf3">  Bash: npm test                   6.7k       32  </tspan><tspan fill="#e6edf3" font-weight="700">   213k</tspan></text>
<text x="20" y="592" xml:space="preserve"><tspan fill="#e6edf3">  Bash: npm test                   6.7k       26  </tspan><tspan fill="#e6edf3" font-weight="700">   173k</tspan></text>
<text x="20" y="612" xml:space="preserve"><tspan fill="#e6edf3">  Bash: npm test                   6.7k       23  </tspan><tspan fill="#e6edf3" font-weight="700">   153k</tspan><tspan fill="#e3b341">  duplicate</tspan></text>
<text x="20" y="632" xml:space="preserve"></text>
<text x="20" y="652" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">What would have helped</tspan></text>
<text x="20" y="672" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">•</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">Cap tool outputs at 2,000 tokens</tspan></text>
<text x="20" y="692" xml:space="preserve"><tspan fill="#e6edf3">    16 outputs were larger; trimming them would have cut 42% of everything the model re-read.</tspan></text>
<text x="20" y="712" xml:space="preserve"><tspan fill="#e6edf3">    Worst: `Bash: npm test` - cap output (`| tail -n 40`, `--quiet`, or a reporter flag).</tspan></text>
<text x="20" y="732" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">•</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">Stop re-fetching identical output</tspan></text>
<text x="20" y="752" xml:space="preserve"><tspan fill="#e6edf3">    11% of re-read tokens were byte-identical copies of an output already in context (same tool,</tspan></text>
<text x="20" y="772" xml:space="preserve"><tspan fill="#e6edf3">    same result). The first copy was enough.</tspan></text>
<text x="20" y="792" xml:space="preserve"></text>
<text x="20" y="812" xml:space="preserve"><tspan fill="#8b949e">Sizes are estimates: 3.6 chars/token, fitted from API-reported usage in 1/1 session(s).</tspan></text>
</g>
</svg>
